<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SanRack License Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: operations console — fixed nav rail, KPI strip, table + detail drawer */
:root{
  --bg:#eef1f5; --panel:#ffffff; --field:#ffffff; --ink:#132030; --muted:#5b6878; --line:#d9dfe6; --soft:#f4f6f9;
  --brand:#0f2a47; --accent:#2590ce; --accent2:#f07c1b; --ok:#2e7d32; --okbg:#e8f4ea; --warn:#b26a00; --warnbg:#fff3df; --bad:#c62828; --badbg:#fdecea; --mutedbg:#eceff3;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b111a;--panel:#121a25;--field:#0e151f;--ink:#e3e9f0;--muted:#8d9bab;--line:#243243;--soft:#172231;--brand:#2590ce;--okbg:#12301a;--warnbg:#382712;--badbg:#3a1818;--mutedbg:#1c2735;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b111a;--panel:#121a25;--field:#0e151f;--ink:#e3e9f0;--muted:#8d9bab;--line:#243243;--soft:#172231;--brand:#2590ce;--okbg:#12301a;--warnbg:#382712;--badbg:#3a1818;--mutedbg:#1c2735;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
nav{background:#0b1726;color:#c3d0de;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 16px;color:#fff;font-weight:700;line-height:1.15}
.brand small{display:block;font-weight:400;color:#8fa6bf;font-size:11.5px}
nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:inherit;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;font-weight:500}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button[aria-current="true"]{background:rgba(37,144,206,.22);color:#fff}
nav button svg{width:18px;height:18px;flex:none}
nav .sp{flex:1}
.keypill{font-size:12px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.06);line-height:1.35}
.keypill b{display:block;color:#fff}
.keypill.on b::before{content:'● ';color:#4cc38a}.keypill.off b::before{content:'● ';color:#f07c1b}
main{padding:22px 28px 60px;min-width:0;display:grid;gap:18px;align-content:start;max-width:1280px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:22px;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.banner{border-radius:10px;padding:10px 12px;font-size:13px;border:1px solid var(--line);background:var(--panel)}
.banner.warn{background:var(--warnbg);border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.ac{border-top:3px solid var(--accent)}.kpi.wa{border-top:3px solid var(--accent2)}.kpi.ba{border-top:3px solid var(--bad)}.kpi.ok{border-top:3px solid var(--ok)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h2{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 span{font-weight:400;color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f{display:grid;gap:4px;min-width:0}
.f>span{font-size:12px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea,.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--field);min-width:0}
.f textarea{resize:vertical}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 12px}
.mono{font-family:var(--mono)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--soft)}
tr.sel{background:var(--soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.s-active{background:var(--okbg);color:var(--ok)}.s-expiring{background:var(--warnbg);color:var(--warn)}.s-expired,.s-revoked{background:var(--badbg);color:var(--bad)}.s-transferred{background:var(--mutedbg);color:var(--muted)}
.list{display:grid;gap:2px}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.li:last-child{border-bottom:0}
.li small{display:block;color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:13px;padding:18px 4px;text-align:center}
.keybox{font:12px/1.5 var(--mono);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px;word-break:break-all;user-select:all;max-height:160px;overflow:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 40px rgba(0,0,0,.18);padding:18px 20px 40px;overflow:auto;z-index:20;display:grid;gap:14px;align-content:start}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dhead h2{margin:0;font-size:18px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv span{color:var(--muted)}
.tl{display:grid;gap:8px;border-left:2px solid var(--line);padding-left:12px;font-size:12.5px}
.tl div small{color:var(--muted);display:block;font-family:var(--mono);font-size:11px}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bars i{display:block;width:100%;max-width:30px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bars span{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.bars b{font-size:11px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f1722;color:#fff;padding:10px 14px;border-radius:9px;font-size:13px;z-index:40;max-width:min(560px,92vw);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.ok-box{background:var(--okbg);border-radius:10px;padding:12px}
.err{color:var(--bad);font-size:12.5px}
.hint{color:var(--muted);font-size:12.5px}
[hidden]{display:none!important}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px 12px;gap:2px}
  .brand{padding:0 8px 0 0}.brand small,nav .sp,.keypill{display:none}
  nav button span{white-space:nowrap}
  main{padding:16px 16px 60px}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <nav aria-label="Sections">
    <div class="brand"><svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#2590ce"/><rect x="7" y="5.5" width="14" height="17" rx="1.6" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="14" cy="12" r="2.6" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M14 14.6v4.4M14 17h2" stroke="#fff" stroke-width="1.4"/></svg><div>SanRack<small>License Manager</small></div></div>
    <button data-v="dash" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Dashboard</span></button>
    <button data-v="issue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg><span>Issue licence</span></button>
    <button data-v="lic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Licences</span></button>
    <button data-v="cli"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.6c1.8.7 3 2.5 3.5 5.4"/></svg><span>Clients</span></button>
    <button data-v="ver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg><span>Verify key</span></button>
    <button data-v="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></button>
    <div class="sp"></div>
    <div class="keypill off" id="keyPill"><b>Signing key not loaded</b>Load it in Settings to issue keys.</div>
  </nav>
  <main id="main"></main>
</div>
<div class="drawer" id="drawer" hidden role="dialog" aria-modal="false" aria-label="Licence details"></div>
<input type="file" id="fileKey" accept=".json,application/json" hidden>
<input type="file" id="fileBackup" accept=".json,application/json" hidden>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* ---------- product constants ---------- */
const PRODUCT = { name: 'SanRack Designer', kid: 'SRD-1DDC4CBC', pub: { kty: 'EC', crv: 'P-256', x: 'yOGygj_5jDyKv2VV2HK2XEGCcfxBM5BHC1OWibMQc2g', y: 'MC4m8qh74-dTXu2Gnw4yFaEh3cpXCZSijEEERP2R6yk' } };
const EDITIONS = ['Pro', 'Standard', 'Enterprise', 'Education'];
// Legacy keys can still be verified, but new issuance is always lifetime.
const LEGACY_TYPES = { perpetual: 'Perpetual (one-time)', annual: 'Annual (12 months)', subscription: 'Subscription (custom end date)', trial: 'Extended trial (30 days)', nfr: 'Not for resale / partner' };
const TYPES = { perpetual: 'Lifetime - permanent' };
const MID_RE = /^SR-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}$/;
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TE = new TextEncoder(), TD = new TextDecoder();
const b64u = { enc: u8 => btoa(String.fromCharCode(...u8)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''), dec: s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); } };
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
const addYears = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setFullYear(x.getFullYear() + n); x.setDate(x.getDate() - 1); return x.toISOString().slice(0, 10); };
const rid = () => crypto.randomUUID();
const money = (v, c) => `${Number(v || 0).toLocaleString('en-US', { maximumFractionDigits: 2 })} ${c || ''}`.trim();
function toast(m, ms = 2800) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, ms); }
async function copyText(t, label) { try { await navigator.clipboard.writeText(t); toast(`${label} copied.`); } catch (e) { toast('Copy was blocked. Select the text and press Ctrl+C.'); } }

/* SUPABASE_CONFIG */
const S = { mode: 'loading', clients: [], licences: [] };
const versions = { clients: {}, licences: {} };
function session() {
  let value; try { value = JSON.parse(localStorage.getItem('sanaya_supabase_session')); } catch (_) {}
  if (!value?.access_token || value.expires_at * 1000 <= Date.now()) {
    location.replace('/login'); throw new Error('Session expired. Please sign in again.');
  }
  return value;
}
async function request(path, options = {}) {
  const auth = session();
  if (!SUPABASE_CONFIG.url || !SUPABASE_CONFIG.anonKey) throw new Error('Supabase connection is not configured.');
  const response = await fetch(SUPABASE_CONFIG.url + '/rest/v1/' + path, {
    ...options, headers: { apikey: SUPABASE_CONFIG.anonKey, Authorization: 'Bearer ' + auth.access_token,
      'Content-Type': 'application/json', ...options.headers }
  });
  const text = await response.text(); const result = text ? JSON.parse(text) : null;
  if (!response.ok) throw new Error(result?.message || 'Supabase request failed. No changes were saved.');
  return result;
}
async function loadRecords() {
  for (const col of ['clients', 'licences']) {
    const rows = []; let page;
    do {
      page = await request('licensing_' + col + '?select=id,data,updated_at&order=id&limit=500&offset=' + rows.length);
      rows.push(...page);
    } while (page.length === 500);
    S[col] = rows.map(r => ({ ...r.data, _id: r.id }));
    versions[col] = Object.fromEntries(rows.map(r => [r.id, r.updated_at]));
  }
}
async function boot() {
  render();
  try {
    if (!await request('rpc/is_academy_admin', { method: 'POST', body: '{}' })) throw new Error('Administrator access is required for licensing.');
    await loadRecords(); S.mode = 'db'; render();
  } catch (e) { S.mode = 'error'; S.error = e.message; render(); }
}
async function saveBatch(items) {
  if (S.mode !== 'db') throw new Error('Connect to Supabase before making changes.');
  const records = items.map(([collection, obj]) => {
    const id = obj._id || crypto.randomUUID(); const data = { ...obj }; delete data._id;
    return { collection, id, data, version: versions[collection][id] || null };
  });
  await request('rpc/save_licensing_records', { method: 'POST', body: JSON.stringify({ records }) });
  // The commit already succeeded; never invite a duplicate issuance if refreshing fails.
  records.forEach(r => { const index = S[r.collection].findIndex(v => v._id === r.id); const value = { ...r.data, _id: r.id }; if (index < 0) S[r.collection].push(value); else S[r.collection][index] = value; });
  try { await loadRecords(); } catch (_) { S.mode = 'error'; S.error = 'Saved successfully. Reload to reconnect before making further changes.'; }
  render(); return records.map(r => r.id);
}
async function save(col, obj) { return (await saveBatch([[col, obj]]))[0]; }
async function remove(col, id) {
  const rows = await request('licensing_' + col + '?id=eq.' + encodeURIComponent(id) + '&updated_at=eq.' + encodeURIComponent(versions[col][id]), { method: 'DELETE', headers: { Prefer: 'return=representation' } });
  if (!rows.length) throw new Error('Record changed. Reload before deleting.');
  S[col] = S[col].filter(x => x._id !== id); render();
}

/* ---------- signing key (stays in this browser, never in shared storage) ---------- */
const K = { priv: null, label: '' };
async function loadKeyJson(text, remember) {
  const j = JSON.parse(text); if (!j.jwk || !j.jwk.d) throw new Error('This file has no private key. Use the PRIVATE signing key file.');
  if (j.kid !== PRODUCT.kid || j.jwk.x !== PRODUCT.pub.x || j.jwk.y !== PRODUCT.pub.y) throw new Error(`This key (${j.kid || 'unknown'}) does not match the public key built into this SanRack release (${PRODUCT.kid}).`);
  K.priv = await crypto.subtle.importKey('jwk', j.jwk, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign']); K.label = j.kid;
  localStorage.removeItem('srlm.key');
  pill(); render();
}
function forgetKey() { K.priv = null; try { localStorage.removeItem('srlm.key'); } catch (e) { } pill(); render(); toast('Signing key removed from this browser.'); }
function pill() { const p = $('#keyPill'); p.className = 'keypill ' + (K.priv ? 'on' : 'off'); p.innerHTML = K.priv ? `<b>Signing key loaded</b>${esc(K.label)} · this browser only` : '<b>Signing key not loaded</b>Load it in Settings to issue keys.'; }
async function signPayload(p) { const b = b64u.enc(TE.encode(JSON.stringify(p))); const sig = new Uint8Array(await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, K.priv, TE.encode(b))); return `SRD1.${b}.${b64u.enc(sig)}`; }
async function verifyKey(key) {
  key = String(key || '').replace(/\s+/g, ''); const parts = key.split('.'); if (parts.length !== 3 || parts[0] !== 'SRD1') throw new Error('Not a SanRack activation key (it should start with SRD1.).');
  let p; try { p = JSON.parse(TD.decode(b64u.dec(parts[1]))); } catch (e) { throw new Error('The key is damaged.'); }
  const pk = await crypto.subtle.importKey('jwk', PRODUCT.pub, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
  const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, pk, b64u.dec(parts[2]), TE.encode(parts[1]));
  return { p, ok: ok && p.kid === PRODUCT.kid };
}
function newLicId() { return 'SRL-' + new Date().getFullYear() + '-' + [...crypto.getRandomValues(new Uint8Array(3))].map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase(); }

/* ---------- derived ---------- */
function status(l) { if (l.status === 'revoked') return 'revoked'; if (l.status === 'transferred') return 'transferred'; if (l.expires && l.expires < today()) return 'expired'; if (l.expires && l.expires <= addDays(today(), 30)) return 'expiring'; return 'active'; }
const STL = { active: 'Active', expiring: 'Expiring', expired: 'Expired', revoked: 'Revoked', transferred: 'Transferred' };
const chip = s => `<span class="chip s-${s}">${STL[s]}</span>`;
const clientOf = l => S.clients.find(c => c._id === l.clientId);
const sortedLic = () => [...S.licences].sort((a, b) => (b.created || '').localeCompare(a.created || ''));

/* ---------- views ---------- */
let view = 'dash', selLic = null, lastIssued = null, licQ = '', licF = 'all', editClient = null, cliQ = '';
try { view = localStorage.getItem('srlm.view') || 'dash'; } catch (e) { }
function render() {
  document.querySelectorAll('nav [data-v]').forEach(b => b.setAttribute('aria-current', b.dataset.v === view));
  const m = $('#main'), fns = { dash: vDash, issue: vIssue, lic: vLic, cli: vCli, ver: vVer, set: vSet };
  const keep = document.activeElement && document.activeElement.id; const pos = keep && document.activeElement.selectionStart;

    const { p, ok } = await verifyKey(k); const rec = S.licences.find(l => l.key === k.replace(/\s+/g, '') || l.licId === p.id);
    const expired = p.x && p.x < today();
    verOut = `<div class="card ${ok ? 'ok-box' : ''}"><h2>${ok ? 'Valid signature' : 'Invalid signature'} ${ok ? (expired ? '<span class="chip s-expired">Expired</span>' : '<span class="chip s-active">Genuine key</span>') : '<span class="chip s-revoked">Forged or altered</span>'}</h2><div class="kv"><span>Licence ID</span><b class="mono">${esc(p.id)}</b><span>Licensee</span><b>${esc(p.n)}${p.c ? ' · ' + esc(p.c) : ''}</b><span>Machine ID</span><b class="mono">${esc(p.m)}</b><span>Edition · type</span><b>${esc(p.e)} · ${esc(TYPES[p.t] || LEGACY_TYPES[p.t] || p.t)}</b><span>Issued</span><b class="mono">${esc(p.i)}</b><span>Valid until</span><b class="mono">${esc(p.x || 'Lifetime')}</b><span>Record</span><b>${rec ? `${chip(status(rec))} <button class="btn sm" data-open="${rec._id}">Open</button>` : 'Not in this database'}</b></div></div>`;
  } catch (e) { verOut = `<div class="card"><div class="err">${esc(e.message)}</div></div>`; }
  render(); $('#v_key').value = k;
}
function backupJson() { return JSON.stringify({ product: PRODUCT.name, kid: PRODUCT.kid, exported: new Date().toISOString(), clients: S.clients, licences: S.licences }, null, 1); }
async function restore(text) {
  const j = JSON.parse(text);
  if (j.kid !== PRODUCT.kid || !Array.isArray(j.licences) || !Array.isArray(j.clients)) throw new Error('Not a backup for this product.');
  for (const l of j.licences) {
    const { p, ok } = await verifyKey(l.key);
    if (!ok || p.id !== l.licId || p.m !== l.machine || p.n !== l.name || p.t !== l.type || (p.x || '') !== (l.expires || '')) throw new Error('Backup contains an invalid or mismatched activation key.');
    if (p.t !== 'perpetual' || p.x) throw new Error('This backup has dated licenses. Reissue them as lifetime licenses; changing a stored date cannot change an existing signed key.');
  }
  await saveBatch([...j.clients.map(c => ['clients', c]), ...j.licences.map(l => ['licences', l])]);
  toast('Backup saved to Supabase.');
}
function csv() { const h = ['Licence ID', 'Licensee', 'Company', 'Email', 'Machine ID', 'Edition', 'Type', 'Issued', 'Valid until', 'Status', 'Price', 'Currency', 'Payment', 'Invoice', 'Key']; const q = v => { const text = String(v ?? ''); return `"${(/^[=+@\-\t\r]/.test(text) ? "'" + text : text).replace(/"/g, '""')}"`; }; return [h.join(','), ...sortedLic().map(l => [l.licId, l.name, l.company, l.email, l.machine, l.edition, l.type, l.issued, l.expires, STL[status(l)], l.price, l.currency, l.pay, l.order, l.key].map(q).join(','))].join('\n'); }
async function offerFile(name, text, mime) {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const link = document.createElement('a'); link.href = url; link.download = name;
  document.body.append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- events ---------- */
let actionBusy = false;
document.addEventListener('click', async e => {
  if (actionBusy) return;
  actionBusy = true;
  try {
  const t = e.target;
  const nv = t.closest('nav [data-v]'); if (nv) { view = nv.dataset.v; try { localStorage.setItem('srlm.view', view); } catch (_) { } render(); return; }
  const go = t.closest('[data-go]'); if (go) { view = go.dataset.go; render(); return; }
  const op = t.closest('[data-open]'); if (op && !t.closest('#drawer .btn:not([data-open])')) { selLic = op.dataset.open; renderDrawer(); document.querySelectorAll('tr.sel').forEach(r => r.classList.remove('sel')); return; }
  const ck = t.closest('[data-copykey]'); if (ck) { const l = S.licences.find(x => x._id === ck.dataset.copykey) || lastIssued; copyText(l.key, 'Activation key'); return; }
  const cm = t.closest('[data-copymail]'); if (cm) { const l = S.licences.find(x => x._id === cm.dataset.copymail) || lastIssued; copyText(emailText(l), 'Email text'); return; }
  const cr = t.closest('[data-cli]'); if (cr) { editClient = Object.assign({}, S.clients.find(c => c._id === cr.dataset.cli)); render(); return; }
  switch (t.id) {
    case 'i_go': await issue(); break;
    case 'd_close': selLic = null; renderDrawer(); break;
    case 'd_revoke': await act(selLic, 'revoke'); break; case 'd_transfer': await act(selLic, 'transfer'); break; case 'd_renew': await act(selLic, 'renew'); break; case 'd_addnote': await act(selLic, 'note'); break; case 'd_delete': await act(selLic, 'delete'); break;
    case 'c_new': editClient = { name: '', country: 'Iraq' }; render(); break;
    case 'c_cancel': editClient = null; render(); break;
    case 'c_save': { const c = Object.assign({}, editClient); ['name', 'company', 'email', 'phone', 'country', 'notes'].forEach(k => c[k] = $('#c_' + k).value.trim()); if (!c.name) { toast('Enter the client name.'); break; } if (!c.created) c.created = new Date().toISOString(); await save('clients', c).then(() => { editClient = null; render(); toast('Client saved.'); }); break; }
    case 'c_del': { if (S.licences.some(l => l.clientId === editClient._id)) { toast('This client has licences. Keep the client so the records stay complete.'); break; } if (!t.dataset.armed) { t.dataset.armed = 1; t.textContent = 'Click again to delete'; break; } await remove('clients', editClient._id).then(() => { editClient = null; render(); }); break; }
    case 'v_go': verifyUI(); break;
    case 'k_load': $('#fileKey').value = ''; $('#fileKey').click(); break;
    case 'k_forget': forgetKey(); break;
    case 'b_exp': offerFile(`SanRack-licences-backup-${today()}.json`, backupJson(), 'application/json'); break;
    case 'b_imp': $('#fileBackup').value = ''; $('#fileBackup').click(); break;
    case 'csv': offerFile(`SanRack-licences-${today()}.csv`, csv(), 'text/csv'); break;
  }
  } catch (err) { toast(err.message, 6000); } finally { actionBusy = false; }
});
document.addEventListener('input', e => {
  const t = e.target, id = t.id;
  if (id && id.startsWith('i_') && id !== 'i_client') { const k = id.slice(2); issueDraft[k] = t.value; if (k === 'machine') confirmDup = false; }
  if (id === 'licQ') { licQ = t.value; render(); } if (id === 'cliQ') { cliQ = t.value; render(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'i_client') { issueDraft.clientId = t.value; render(); }
  if (t.id === 'i_type') { issueDraft.type = t.value; issueDraft.expires = t.value === 'annual' ? addYears(today(), 1) : t.value === 'trial' ? addDays(today(), 30) : t.value === 'perpetual' ? '' : issueDraft.expires; render(); }
  if (t.id === 'licF') { licF = t.value; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && selLic) { selLic = null; renderDrawer(); } });
$('#fileKey').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = async () => { try { await loadKeyJson(r.result, $('#k_rem') && $('#k_rem').checked); toast('Signing key loaded. You can issue licences.'); } catch (err) { const el = $('#k_err'); if (el) el.textContent = err.message; } }; r.readAsText(f); });
$('#fileBackup').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = async () => { try { await restore(r.result); } catch (err) { toast(err.message); } }; r.readAsText(f); });
localStorage.removeItem('srlm.key'); pill(); boot();
</script>
